[package]
name = "minus-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4", "async"] }
napi-derive = "2.16"
sha2 = "0.10"
memmap2 = "0.9"
regex = "1.11"
walkdir = "2.5"

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
